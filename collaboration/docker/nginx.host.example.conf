server {
    listen 80;
    server_name partner.tongzhoukuajing.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/partner.tongzhoukuajing.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name partner.tongzhoukuajing.com;

    ssl_certificate /www/server/panel/vhost/letsencrypt/partner.tongzhoukuajing.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/partner.tongzhoukuajing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /collaboration/internal {
        return 404;
    }

    location ^~ /collaboration/internal/ {
        return 404;
    }

    location /collaboration/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 52m;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /www/wwwlogs/partner.tongzhoukuajing.com.log;
    error_log /www/wwwlogs/partner.tongzhoukuajing.com.error.log;
}
