model:
  default: anthropic/claude-sonnet-4.6

agent:
  max_iterations: 12
  disabled_toolsets:
    - web
    - search
    - terminal
    - file
    - browser
    - vision
    - image_gen
    - skills
    - tts
    - todo
    - memory
    - session_search
    - cronjob
    - code_execution
    - delegation
    - clarify
    - messaging
    - discord
    - discord_admin
    - debugging
    - safe

platform_toolsets:
  api_server:
    - tongzhou-business

plugins:
  enabled:
    - tongzhou-business
  hook_callback_timeout: 15

memory:
  memory_enabled: false
  user_profile_enabled: false

compression:
  enabled: true

gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: 4
    cors_origins: ""
