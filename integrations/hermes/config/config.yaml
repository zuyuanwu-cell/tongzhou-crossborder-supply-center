model:
  provider: custom:tongzhou
  default: deepseek-v4-pro

providers:
  tongzhou:
    api: http://host.docker.internal:8787/api/internal/hermes/v1/model
    key_env: HERMES_MODEL_API_KEY
    transport: chat_completions
    default_model: deepseek-v4-pro
    discover_models: false

agent:
  max_turns: 24
  disabled_toolsets:
    - web
    - search
    - terminal
    - file
    - browser
    - vision
    - image_gen
    - skills
    - tts
    - todo
    - memory
    - session_search
    - cronjob
    - code_execution
    - delegation
    - clarify
    - messaging
    - discord
    - discord_admin
    - debugging
    - safe

platform_toolsets:
  api_server:
    - tongzhou-business

plugins:
  enabled:
    - tongzhou-business
  hook_callback_timeout: 15

memory:
  memory_enabled: false
  user_profile_enabled: false

compression:
  enabled: true

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

gateway:
  multiplex_profiles: true
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: 4
    cors_origins: ""
