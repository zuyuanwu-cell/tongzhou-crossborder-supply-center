services:
  hermes:
    image: ${HERMES_RUNTIME_IMAGE:?Set HERMES_RUNTIME_IMAGE to the reviewed image@sha256 digest}
    container_name: tongzhou-hermes
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /run/tongzhou-hermes /opt/data/profiles/tongzhou-partner-progress
        printf '%s\n' \
          "HERMES_MODEL_API_KEY=$${HERMES_MODEL_API_KEY}" \
          > /run/tongzhou-hermes/main.env
        printf '%s\n' \
          "API_SERVER_KEY=$${HERMES_PARTNER_API_KEY}" \
          "HERMES_PARTNER_MODEL_API_KEY=$${HERMES_PARTNER_MODEL_PROXY_KEY}" \
          > /run/tongzhou-hermes/partner.env
        rm -f /opt/data/.env /opt/data/profiles/tongzhou-partner-progress/.env
        ln -s /run/tongzhou-hermes/main.env /opt/data/.env
        ln -s /run/tongzhou-hermes/partner.env /opt/data/profiles/tongzhou-partner-progress/.env
        exec hermes gateway run
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      # s6-overlay copies its stage binaries into /run and must execute them there.
      - /run:size=32m,mode=755,exec
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    volumes:
      - hermes-state:/opt/data
      - ./config/config.yaml:/opt/data/config.yaml:ro
      - ./config/SOUL.md:/opt/data/SOUL.md:ro
      - ./tool-manifest.json:/opt/data/tool-manifest.json:ro
      - ./plugins/tongzhou-business:/opt/data/plugins/tongzhou-business:ro
      - ./profiles/tongzhou-partner-progress/config.yaml:/opt/data/profiles/tongzhou-partner-progress/config.yaml:ro
      - ./profiles/tongzhou-partner-progress/SOUL.md:/opt/data/profiles/tongzhou-partner-progress/SOUL.md:ro
    ports:
      - "127.0.0.1:8642:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      HERMES_PARTNER_API_KEY: ${HERMES_PARTNER_API_KEY:?HERMES_PARTNER_API_KEY is required}
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_BRIDGE_SECRET: ${HERMES_BRIDGE_SECRET:?HERMES_BRIDGE_SECRET is required}
      # This authenticates Hermes to the Tongzhou model proxy. The real DeepSeek key stays encrypted in Node.
      HERMES_MODEL_API_KEY: ${HERMES_MODEL_PROXY_KEY:?HERMES_MODEL_PROXY_KEY is required}
      # Separate identity lets Node enforce JSON-only, low-temperature partner extraction.
      HERMES_PARTNER_MODEL_PROXY_KEY: ${HERMES_PARTNER_MODEL_PROXY_KEY:?HERMES_PARTNER_MODEL_PROXY_KEY is required}
      # The partner profile resolves its provider credential through key_env.
      # Keep the resolved name in the container environment instead of relying
      # on a mutable profile .env file left in the persistent state volume.
      HERMES_PARTNER_MODEL_API_KEY: ${HERMES_PARTNER_MODEL_PROXY_KEY:?HERMES_PARTNER_MODEL_PROXY_KEY is required}
      TONGZHOU_BRIDGE_BASE_URL: ${TONGZHOU_BRIDGE_BASE_URL:-http://host.docker.internal:8787}
    # control: internal-only private network (no route out).
    # host_access: ordinary bridge. Docker skips port publishing for containers that only
    # sit on internal networks, and host.docker.internal is unreachable from them, so
    # without this second network 127.0.0.1:8642 and the model proxy/bridge on :8787
    # both silently break. Block outbound internet with the DOCKER-USER rule in README.
    networks:
      - control
      - host_access
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8642/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  hermes-state:
    name: tongzhou-hermes-state

networks:
  control:
    name: tongzhou-hermes-control
    internal: true
  host_access:
    name: tongzhou-hermes-host
    ipam:
      config:
        - subnet: ${HERMES_HOST_SUBNET:-172.30.86.0/24}
